name: preview

# Comment `/preview` on a PR → build the plugin, start Paper, expose it through the
# playit.gg game tunnel. Join with a vanilla client at the address below.
#
# - One slot: the latest `/preview` cancels the previous one.
# - Stops after 10 min with no players, or 1 h max.
# - Only PRs from this repo (not forks), only commenters with write access:
#   the playit secret is in the job, next to code from the PR.
# - Resource pack: not served here (free playit plan has no TCP tunnel). See #18.

on:
  issue_comment:
    types: [created]

env:
  ADDRESS: impairment-weakness.tun.ply.gg

# Only real `/preview` comments share the slot. Any other comment gets its own
# throwaway group, so it never cancels a running preview.
concurrency:
  group: ${{ (github.event.issue.pull_request && (github.event.comment.body == '/preview' || startsWith(github.event.comment.body, '/preview '))) && 'preview' || format('preview-noop-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      github.event.issue.pull_request &&
      (github.event.comment.body == '/preview' || startsWith(github.event.comment.body, '/preview ')) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    # 1 h of play + build and startup time.
    timeout-minutes: 75
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.issue.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Refuse fork PRs
        run: |
          head_repo=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.repo.full_name')
          if [ "$head_repo" != "$REPO" ]; then
            gh pr comment "$PR" -R "$REPO" --body "**/preview refused:** PRs from forks can't get a preview server."
            exit 1
          fi
          gh api -X POST "repos/$REPO/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes >/dev/null

      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      # Minecraft 26.1+ (and Paper) need Java 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare server folder
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          RCON_PASSWORD=$(openssl rand -hex 16)
          echo "::add-mask::$RCON_PASSWORD"
          echo "RCON_PASSWORD=$RCON_PASSWORD" >> "$GITHUB_ENV"
          # 26.3 turns the whitelist on for new servers: turn it off for previews.
          cat > run/server.properties <<EOF
          server-port=25565
          online-mode=true
          white-list=false
          enforce-whitelist=false
          enable-rcon=true
          rcon.port=25575
          rcon.password=$RCON_PASSWORD
          motd=Rune preview - PR #$PR
          EOF

      - name: Start Paper
        run: |
          # The server is public: keep the GitHub token and RCON password out of its environment.
          nohup env -u GH_TOKEN -u RCON_PASSWORD ./gradlew runServer --no-daemon > server.log 2>&1 &
          # Build + Paper download + world generation.
          for i in $(seq 1 120); do
            if grep -q 'Done (' server.log; then echo "Server is up"; exit 0; fi
            if grep -q 'BUILD FAILED' server.log; then break; fi
            sleep 5
          done
          echo "Server did not start"; tail -n 80 server.log
          gh pr comment "$PR" -R "$REPO" --body "**/preview failed:** the server did not start. See the [run log](${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }})."
          exit 1

      - name: Start playit tunnel
        env:
          SECRET_KEY: ${{ secrets.PLAYIT_SECRET_KEY }}
        run: |
          # `-e SECRET_KEY` (no value) passes it from the env: not in the script or process list.
          docker run -d --name playit --net=host \
            -e SECRET_KEY \
            ghcr.io/playit-cloud/playit-agent:latest
          sleep 10
          docker logs playit 2>&1 | tail -n 20

      - name: Comment the address
        run: |
          gh pr comment "$PR" -R "$REPO" --body "**🟢 Preview live: PR #$PR**

          - Address: \`$ADDRESS\`
          - Join with a vanilla client.
          - Stops after **10 min with no players**, or **1 h** max.
          - A new \`/preview\` on any PR replaces this one."
          echo "LIVE=1" >> "$GITHUB_ENV"

      - name: Keep running while players are online
        run: |
          cat > rcon.py <<'EOF'
          import os, socket, struct, sys
          def packet(i, t, body):
              data = struct.pack('<ii', i, t) + body.encode() + b'\x00\x00'
              return struct.pack('<i', len(data)) + data
          def read(s):
              n = struct.unpack('<i', s.recv(4))[0]
              buf = b''
              while len(buf) < n:
                  buf += s.recv(n - len(buf))
              return buf[8:-2].decode(errors='replace')
          s = socket.create_connection(('127.0.0.1', 25575), timeout=10)
          s.sendall(packet(1, 3, os.environ['RCON_PASSWORD'])); read(s)
          s.sendall(packet(2, 2, sys.argv[1])); print(read(s))
          EOF
          start=$(date +%s); last_player=$start
          while true; do
            now=$(date +%s)
            # "There are N of a max of M players online"
            # RCON failing is not "0 players": don't count it as idle (the 1 h cap still applies).
            if ! out=$(python3 rcon.py list 2>/dev/null); then last_player=$now; out=""; fi
            count=$(echo "$out" | grep -oE 'There are [0-9]+' | grep -oE '[0-9]+' || echo 0)
            [ "${count:-0}" -gt 0 ] && last_player=$now
            if [ $((now - last_player)) -ge 600 ]; then reason="10 min with no players"; break; fi
            if [ $((now - start)) -ge 3600 ]; then reason="1 h limit reached"; break; fi
            if ! pgrep -f runServer >/dev/null; then reason="the server stopped"; break; fi
            sleep 30
          done
          echo "Stopping: $reason"
          echo "REASON=$reason" >> "$GITHUB_ENV"
          python3 rcon.py stop || true
          sleep 15

      # Only once the 🟢 comment was posted (a failed start already got its own comment).
      - name: Comment the stop
        if: always() && env.LIVE == '1'
        run: |
          reason="${REASON:-the run was cancelled or failed}"
          gh pr comment "$PR" -R "$REPO" --body "**⚪ Preview stopped: PR #$PR** ($reason). Comment \`/preview\` to start it again."

      - name: Stop playit tunnel
        if: always()
        run: docker rm -f playit >/dev/null 2>&1 || true
