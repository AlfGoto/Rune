name: test

# Build + MockBukkit tests on PRs (no re-run on main after merge: tests already ran on the PR).
# Runs only when code or build files change. Docs-only PRs cost 0 Actions minutes.
# Note: does nothing until the Gradle scaffold (build.gradle.kts, gradlew) is merged.
on:
  pull_request:
    paths:
      - 'src/**'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/test.yml'

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Minecraft 26.1+ (and Paper) need Java 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build
