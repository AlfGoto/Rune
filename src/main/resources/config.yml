account:
  level-curve:
    # XP to next Account Level = base * level ^ exponent
    base: 200
    exponent: 1.3
capacity:
  rune-cost:
    # Capacity Cost of a Rank 1 Rune, lowest Rarity first (Common, Uncommon, Rare, Epic, Legendary)
    base: [1, 2, 3, 5, 8]
    # Added to the Capacity Cost for each Rank above 1
    per-rank: 1
  player:
    # Player Capacity = min(max, base + per-account-level * Account Level)
    base: 5
    per-account-level: 1
    max: 40
quests:
  # Quest Tier multipliers, lowest Tier first (one per Rarity)
  tier-multipliers: [1, 1.5, 2, 3, 5]
  # Lowest Job Level at which each Quest Tier can be drawn (Epic 15, Legendary 25)
  tier-min-levels: [1, 1, 1, 15, 25]
  # Quest Tier draw weight = max(0, base + per-level * Job Level), lowest Tier first
  tier-weights:
    base: [100, 60, 30, 10, 5]
    per-level: [-1.2, 0, 0.6, 0.5, 0.2]
  # Most Reroll Tokens a player can hold (one is earned per world day)
  max-reroll-tokens: 3
rewards:
  # Loot odds boost per source Rarity (Rune Cache Rarity or Quest Tier), lowest first.
  # An entry weighs base weight x boost ^ (its own Rarity index), Common = 0 ... Legendary = 4.
  rarity-boost: [1, 1.5, 2, 3, 4]
  # How many times a source of each Rarity rolls the loot table, lowest first
  rolls-by-rarity: [1, 1, 2, 2, 3]
  # Chance that a roll with a Job gives that Job's Runes instead of general Runes (0 to 1)
  job-bias: 0.6
runes:
  # Value of a Rune = base + per-rank * (Rank - 1), from docs/jobs/mining.md. Chances are in percent
  # (100 = guaranteed). Silk Touch is on/off. max-rank is the highest Rank when ranking up.
  fortune:
    base: 15
    per-rank: 15
    max-rank: 3
  smelt:
    base: 25
    per-rank: 25
    max-rank: 3
  silk_touch:
    base: 1
    per-rank: 0
    max-rank: 1
  # Deepstride: no Max Rank. The value is the depth line (Y): Rank 1 = below Y 0, each Rank moves it up by
  # per-rank. speed = % mining speed below the line.
  deepstride:
    base: 0
    per-rank: 16
    speed: 20
  # Ore Sense: chance (%) that breaking a stone-family block outlines ores in a cube of radius blocks each way (so 8 = 17x17x17) for seconds.
  ore_sense:
    base: 5
    per-rank: 5
    max-rank: 3
    radius: 8
    seconds: 5
  # Ore Bloom: chance (%) that mining an ore turns a neighbouring stone-family block into that ore.
  ore_bloom:
    base: 8
    per-rank: 8
    max-rank: 5
  speed:
    # Mining speed Runes (docs/jobs/mining.md): % speed per Rank and Max Rank
    haste:
      per-rank: 8
      max-rank: 5
    # One Rune per ore
    specialist:
      per-rank: 20
      max-rank: 3
    # One Rune per Place
    affinity:
      per-rank: 10
      max-rank: 3
tools:
  # Mining speed by Harvest Tier: stone, iron, diamond (vanilla values)
  speed-by-tier: [4, 6, 8]
  # Epic and Legendary tools use gold speed whatever their tier
  epic-speed: 12
  # Durability by Harvest Tier: stone, iron, diamond (vanilla values)
  durability-by-tier: [131, 250, 1561]
  # Epic and Legendary tools use netherite durability whatever their tier
  epic-durability: 2031
  # Rune slots by Rarity, lowest first
  slots-by-rarity: [1, 2, 3, 4, 5]
  # Capacity by Rarity, lowest first
  capacity-by-rarity: [3, 6, 10, 14, 18]
  mastery:
    # Valuable Job Actions for +1 Capacity: pickaxe = ores mined, axe = logs cut
    # (bone-meal-grown logs count x jobs.bonemeal-multiplier). Other tools have no Mastery yet.
    pickaxe-actions: 500
    axe-actions: 1000
    # Mastery stops at this share of the tool's base Capacity (0.75 = +75%, rounded down)
    max-bonus: 0.75
armor:
  # Rune Armor follows vanilla by Rarity: Common = leather, Uncommon = chainmail, Rare = iron,
  # Epic = diamond, Legendary = netherite. Each list is lowest Rarity first.
  # Slots and Capacity are the ones of tools.slots-by-rarity and tools.capacity-by-rarity.
  # Protection (armor points) by piece
  defense:
    helmet: [1, 2, 2, 3, 3]
    chestplate: [3, 5, 6, 8, 8]
    leggings: [2, 4, 5, 6, 6]
    boots: [1, 1, 2, 3, 3]
  # Durability by piece
  durability:
    helmet: [55, 165, 165, 363, 407]
    chestplate: [80, 240, 240, 528, 592]
    leggings: [75, 225, 225, 495, 555]
    boots: [65, 195, 195, 429, 481]
  # Armor toughness of each piece
  toughness-by-rarity: [0, 0, 0, 2, 3]
resource-pack:
  # Port of the built-in HTTP server that serves the pack. Open it to players (TCP).
  port: 8123
  # Leave empty to use the built-in server. Otherwise players download the pack from this URL,
  # which must serve the file the plugin builds (plugins/Rune/rune-pack.zip). Nothing is served then.
  external-url: ""
