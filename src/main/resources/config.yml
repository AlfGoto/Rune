account:
  level-curve:
    # XP to next Account Level = base * level ^ exponent
    base: 200
    exponent: 1.3
capacity:
  rune-cost:
    # Capacity Cost of a Rank 1 Rune, lowest Rarity first (Common, Uncommon, Rare, Epic, Legendary)
    base: [1, 2, 3, 5, 8]
    # Added to the Capacity Cost for each Rank above 1
    per-rank: 1
  player:
    # Player Capacity = min(max, base + per-account-level * Account Level)
    base: 5
    per-account-level: 1
    max: 40
quests:
  # Quest Tier multipliers, lowest Tier first (one per Rarity)
  tier-multipliers: [1, 1.5, 2, 3, 5]
  # Lowest Job Level at which each Quest Tier can be drawn (Epic 15, Legendary 25)
  tier-min-levels: [1, 1, 1, 15, 25]
  # Quest Tier draw weight = max(0, base + per-level * Job Level), lowest Tier first
  tier-weights:
    base: [100, 60, 30, 10, 5]
    per-level: [-1.2, 0, 0.6, 0.5, 0.2]
  # Most Reroll Tokens a player can hold (one is earned per world day)
  max-reroll-tokens: 3
  # Job XP (in the Quest's Job) and Account XP bonus a completed Quest gives, lowest Tier first.
  # A completed Quest also rolls the 'cache' loot table (see rewards below).
  reward-job-xp: [50, 75, 100, 150, 250]
  reward-account-xp: [25, 40, 50, 75, 125]
rewards:
  # Loot odds boost per source Rarity (Rune Cache Rarity or Quest Tier), lowest first.
  # An entry weighs base weight x boost ^ (its own Rarity index), Common = 0 ... Legendary = 4.
  rarity-boost: [1, 1.5, 2, 3, 4]
  # How many times a source of each Rarity rolls the loot table, lowest first
  rolls-by-rarity: [1, 1, 2, 2, 3]
  # Chance that a roll with a Job gives that Job's Runes instead of general Runes (0 to 1)
  job-bias: 0.6
caches:
  # Rune Cache drop chance per Job Action = Job XP x this, in percent (0.05: iron ore, 8 XP = 0.4%).
  # Raise it to test (10000 = every natural block drops a Cache). The Cache drops at the block.
  drop-percent-per-xp: 0.05
  # Rarity of a Cache dropped by a Job Action (common, uncommon, rare, epic, legendary). No drops in Creative.
  drop-rarity: common
  # Milestone Cache (given on Job Level up): Rarity by Job Level, then the rule above the table
  milestones:
    5: common
    10: uncommon
    15: rare
    20: rare
    25: epic
    30: epic
  # Above the table: an Epic Cache every N levels, a Legendary one every M levels (wins over Epic)
  epic-every: 5
  legendary-every: 25
blueprints:
  # Blueprint given on Job Level up: Job id, then Job Level, then Blueprint id (= the id of the recipe it unlocks).
  # A Blueprint that is not registered yet is skipped. Using the Blueprint unlocks the recipe for good.
  milestones:
    mining:
      22: briseroc
      30: heart_of_the_mountain
    woodcutting:
      22: elder_axe
      30: elders_bark
vanilla-overrides:
  # Rarity of the Rune Cache that replaces each enchanted book in chests, fishing and villager trades
  # (common, uncommon, rare, epic, legendary)
  book-cache-rarity: uncommon
runes:
  rank-up:
    # Rank-up at the smithing table costs vanilla XP levels: multiplier ^ N to go from Rank N to N+1
    # (3 gives 3, 9, 27... levels)
    cost-multiplier: 3
  # Echo Pickaxe: pings by itself while held in the main hand. Ores in a cube of radius blocks are outlined for
  # seconds. The Bone Pickaxe uses runes.ore_sense below (its base is the Bone's chance).
  echo_ping:
    interval-seconds: 10
    radius: 12
    seconds: 5
    # Capacity added to the Echo Pickaxe's base Capacity of 10 (10 + 2 = 12)
    capacity-modifier: 2
  # Value of a Rune = base + per-rank * (Rank - 1), from docs/jobs/mining.md. Chances are in percent
  # (100 = guaranteed). Silk Touch is on/off. max-rank is the highest Rank when ranking up.
  fortune:
    base: 15
    per-rank: 15
    max-rank: 3
  smelt:
    base: 25
    per-rank: 25
    max-rank: 3
  silk_touch:
    base: 1
    per-rank: 0
    max-rank: 1
  # Sturdy: % less durability use (each point of damage is spared with this chance, capped at 100).
  sturdy:
    base: 25
    per-rank: 25
    max-rank: 4
  # Magnet: radius in blocks around the broken block. Drops there go straight into the inventory.
  magnet:
    base: 2
    per-rank: 2
    max-rank: 3
  # Cache Hunter: % more Rune Cache chance (relative: 15 turns a 2% chance into 2.3%).
  cache_hunter:
    base: 15
    per-rank: 15
    max-rank: 3
  # Deepstride: no Max Rank. The value is the depth line (Y): Rank 1 = below Y 0, each Rank moves it up by
  # per-rank. speed = % mining speed below the line.
  deepstride:
    base: 0
    per-rank: 16
    speed: 20
  # Ore Sense: chance (%) that breaking a stone-family block outlines ores in a cube of radius blocks each way (so 8 = 17x17x17) for seconds.
  ore_sense:
    base: 5
    per-rank: 5
    max-rank: 3
    radius: 8
    seconds: 5
  # Ore Bloom: chance (%) that mining an ore turns a neighbouring stone-family block into that ore.
  ore_bloom:
    base: 8
    per-rank: 8
    max-rank: 5
  # Veinminer: the most blocks one mining breaks (the first included). Rank 1 = base, then times ratio each
  # Rank: 8 / 16 / 32.
  veinminer:
    base: 8
    ratio: 2
    max-rank: 3
  # Treefeller: the most blocks one felling breaks (the first included, logs and canopy together). Rank 1 = base,
  # then times ratio each Rank: 16 / 32 / 64.
  treefeller:
    base: 16
    ratio: 2
    max-rank: 3
  # Woodcutting Runes (docs/jobs/woodcutting.md). Starting values, tuned after playtests.
  # Leaf Fall: radius in blocks (2 / 4 / 6)
  leaf_fall:
    base: 2
    per-rank: 2
    max-rank: 3
  # Orchard: % extra apple and sapling rolls from leaves
  orchard:
    base: 10
    per-rank: 10
    max-rank: 3
  # Canopy Stride: % move speed on leaves and logs. No Max Rank.
  canopy_stride:
    base: 10
    per-rank: 10
  # Sanctuary: <biome> (docs/jobs/woodcutting.md). Value = Rank (base 1, +1 per Rank). Total value 1 gives
  # Regeneration I, resistance-from adds Resistance I, regeneration-2-from makes it Regeneration II.
  # effect-seconds: how long each refresh lasts (the effect ends this long after leaving the biome).
  sanctuary:
    base: 1
    per-rank: 1
    max-rank: 3
    resistance-from: 2
    regeneration-2-from: 3
    effect-seconds: 3
  # Replant: on/off (Max Rank 1). Plants a sapling where a Felled Tree stood.
  replant:
    base: 1
    per-rank: 0
    max-rank: 1
  # Tree Dash (Active): range in blocks (8 / 12 / 16), cooldown in seconds. The dash pushes the player
  # speed-per-block per block of distance, up to max-speed.
  tree_dash:
    base: 8
    per-rank: 4
    max-rank: 3
    cooldown: 10
    speed-per-block: 0.2
    max-speed: 2.5
    # Minimum upward push: lifts the player off the ground so ground friction does not stop the dash short.
    lift: 0.4
    # How far (blocks) the click looks for a log, to tell "out of range" from "not looking at a log".
    look-reach: 64
  speed:
    # Mining speed Runes (docs/jobs/mining.md): % speed per Rank and Max Rank
    haste:
      per-rank: 8
      max-rank: 5
    # One Rune per ore and one per wood type
    specialist:
      per-rank: 20
      max-rank: 3
    # One Rune per Place
    affinity:
      per-rank: 10
      max-rank: 3
traits:
  # Trait extras of the Woodcutting axes (docs/jobs/woodcutting.md). Starting values, tuned after playtests.
  # The Affinity Trait of every axe uses the Rank 1 value of runes.speed.affinity (per-rank).
  # Birch Axe: Speed I for some seconds after each Felled Tree
  felled_tree_speed:
    seconds: 5
  # Poplar Axe: leaves that fall with a Felled Tree. reach = blocks from the last log, max_leaves = cap per tree
  felled_tree_leaf_fall:
    reach: 7
    max_leaves: 600
  # Orchard Axe: % extra apple and sapling rolls on leaves (the Orchard Rune gives 10 per Rank)
  orchard_axe:
    orchard_percent: 20
  # Golden Bough: % chance of a golden apple per oak leaf broken or made to fall
  golden_bough:
    golden_apple_percent: 0.5
  # Flint Pickaxe: fortune = % chance of +1 drop, slower_percent = % slower mining
  flint_pickaxe:
    fortune: 15
    slower_percent: 10
  # Coal Pickaxe: faster_percent = % faster mining, durability = max durability (stone tier default is 131)
  coal_pickaxe:
    faster_percent: 15
    durability: 100
  # Ironbound Pickaxe: durability = max durability (iron tier default is 250)
  ironbound_pickaxe:
    durability: 500
  # Flint Hatchet: fortune = % chance of +1 log, slower_percent = % slower mining
  flint_hatchet:
    fortune: 15
    slower_percent: 10
  # Stone Hatchet: faster_percent = % faster mining, durability = max durability (stone tier default is 131)
  stone_hatchet:
    faster_percent: 15
    durability: 100
  # Woodsman's Axe: durability = max durability (iron tier default is 250)
  woodsmans_axe:
    durability: 500
  # Jungle Axe: % climbing speed on vines, ladders and scaffolding
  climb_speed:
    percent: 50
tools:
  # Mining speed by Harvest Tier: stone, iron, diamond (vanilla values)
  speed-by-tier: [4, 6, 8]
  # Epic and Legendary tools use gold speed whatever their tier
  epic-speed: 12
  # Durability by Harvest Tier: stone, iron, diamond (vanilla values)
  durability-by-tier: [131, 250, 1561]
  # Epic and Legendary tools use netherite durability whatever their tier
  epic-durability: 2031
  # Rune slots by Rarity, lowest first
  slots-by-rarity: [1, 2, 3, 4, 5]
  # Capacity by Rarity, lowest first
  capacity-by-rarity: [3, 6, 10, 14, 18]
  mastery:
    # Valuable Job Actions for +1 Capacity: pickaxe = ores mined, axe = logs cut
    # (bone-meal-grown logs count x jobs.bonemeal-multiplier). Other tools have no Mastery yet.
    pickaxe-actions: 500
    axe-actions: 1000
    # Mastery stops at this share of the tool's base Capacity (0.75 = +75%, rounded down)
    max-bonus: 0.75
  # Biome pickaxe Traits (docs/jobs/mining.md). Starting values, tuned after playtests.
  traits:
    # % mining speed of an Affinity Trait in its Place (same as an Affinity Rune at Rank 1)
    affinity: 10
    # Lichen glow: light level (1 to 15) at the player's head, main hand only
    glow-light: 12
    # Fiery: Smelt chance in %
    fiery-smelt: 25
    # Emerald: % move speed in Mountains while held
    mountain-move-speed: 10
  # Copper Pickaxe and Copper Axe (docs/jobs/mining.md): the tool oxidizes as blocks are broken.
  # 4 stages (Copper, Exposed, Weathered, Oxidized). Starting values, tuned after playtests.
  copper:
    # Blocks broken for one stage
    blocks-per-stage: 300
    # Haste in % at the last stage: 0, +10, +20, +30% across the stages
    speed: 30
  # Redstone Pickaxe and Breeze Axe: faster per block in a row (a log for the axe)
  momentum:
    # Haste in % at full Momentum (+5% per block with 10 blocks)
    speed: 50
    # Blocks in a row at full Momentum
    max-blocks: 10
    # Seconds between two breaks before Momentum resets
    reset-seconds: 2
    # Capacity added to the Redstone Pickaxe and Breeze Axe (negative: a drawback)
    capacity-modifier: -2
armor:
  # Rune Armor follows vanilla by Rarity: Common = leather, Uncommon = chainmail, Rare = iron,
  # Epic = diamond, Legendary = netherite. Each list is lowest Rarity first.
  # Slots and Capacity are the ones of tools.slots-by-rarity and tools.capacity-by-rarity.
  # Protection (armor points) by piece
  defense:
    helmet: [1, 2, 2, 3, 3]
    chestplate: [3, 5, 6, 8, 8]
    leggings: [2, 4, 5, 6, 6]
    boots: [1, 1, 2, 3, 3]
  # Durability by piece
  durability:
    helmet: [55, 165, 165, 363, 407]
    chestplate: [80, 240, 240, 528, 592]
    leggings: [75, 225, 225, 495, 555]
    boots: [65, 195, 195, 429, 481]
  # Armor toughness of each piece
  toughness-by-rarity: [0, 0, 0, 2, 3]
  # Mining armor ("deeper = stronger", docs/jobs/mining.md): a Trait is 0% at top-y and 100% at
  # bottom-y, linear in between, and stays at 0% above / 100% below.
  depth:
    top-y: 64
    bottom-y: -64
  # Woodcutting armor ("Rhythm", docs/jobs/woodcutting.md): each Felled Tree adds one charge, up to
  # max-charges. Every charge is lost after reset-seconds without a Felled Tree. A Trait goes from 0% (no
  # charge) to its value below (in percent) at max-charges. Values by Rarity; Rare and up come with their pieces.
  rhythm:
    max-charges: 10
    reset-seconds: 30
    chop-speed: {common: 15, uncommon: 25}        # helmet: log breaking speed
    damage-reduction: {common: 8, uncommon: 12}   # chestplate: damage taken
    move-speed: {common: 8, uncommon: 12}         # leggings: movement speed
    jump: {common: 10, uncommon: 15}              # boots: jump strength
    fall-reduction: {common: 20, uncommon: 35}    # boots: fall damage taken
resource-pack:
  # Port of the built-in HTTP server that serves the pack. Open it to players (TCP).
  port: 8123
  # Leave empty to use the built-in server. Otherwise players download the pack from this URL,
  # which must serve the file the plugin builds (plugins/Rune/rune-pack.zip). Nothing is served then.
  external-url: ""
