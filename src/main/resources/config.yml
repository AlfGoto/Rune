# Rune balancing numbers. A bad value is logged as an error and the default is used.
jobs:
  level-curve:
    # XP to next level = base * level ^ exponent (one curve for all Jobs)
    base: 50
    exponent: 1.3
quests:
  # Quest Tier multipliers, lowest Tier first (one per Rarity)
  tier-multipliers: [1, 1.5, 2, 3, 5]
